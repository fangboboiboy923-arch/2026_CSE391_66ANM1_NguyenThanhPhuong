<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ lọc và tìm kiếm sinh viên</title>
<link rel="stylesheet" href="style1.css">
</head>

<body>

<h1>Quản Lý Điểm Sinh Viên</h1>

<div class="input-area">
<input type="text" id="nameField" placeholder="Nhập họ tên">
<input type="number" id="scoreField" placeholder="Nhập điểm (0-10)" min="0" max="10" step="0.1">
<button id="addStudent">Thêm</button>
</div>

<div class="search-area">
<input type="text" id="searchName" placeholder="Tìm kiếm theo họ tên...">

<select id="filterRank">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>
</div>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th class="sort-score" id="sortScore">Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="studentList"></tbody>

</table>

<div class="summary" id="summaryBox">
Tổng số sinh viên: 0 | Điểm trung bình: 0.00
</div>

<script src="style.js"></script>

</body>
</html>
