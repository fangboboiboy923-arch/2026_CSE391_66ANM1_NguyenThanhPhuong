<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Điểm Sinh Viên</title>

<style>

body{
  font-family:Arial, sans-serif;
  max-width:900px;
  margin:30px auto;
  padding:20px;
  background:#f7f7f7;
}

h1{
  text-align:center;
  color:#333;
}

.form-box{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

input,button{
  padding:10px;
  font-size:16px;
}

input{
  flex:1;
  min-width:200px;
}

button{
  background:#007bff;
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  background:#0056b3;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

th{
  background:#e9ecef;
}

.warn{
  background:yellow;
}

.remove{
  background:#dc3545;
  padding:6px 10px;
  border-radius:4px;
}

.remove:hover{
  background:#a71d2a;
}

.summary{
  margin-top:15px;
  font-weight:bold;
}

</style>
</head>

<body>

<h1>Quản Lý Điểm Sinh Viên</h1>

<div class="form-box">
<input type="text" id="nameInput" placeholder="Nhập họ tên sinh viên">
<input type="number" id="scoreInput" placeholder="Nhập điểm (0-10)" step="0.1" min="0" max="10">
<button id="addBtn">Thêm</button>
</div>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>
</table>

<div class="summary" id="info">
Tổng số sinh viên: 0 | Điểm trung bình: 0.00
</div>

<script>

const nameField=document.getElementById("nameInput")
const scoreField=document.getElementById("scoreInput")
const addBtn=document.getElementById("addBtn")
const table=document.getElementById("studentTable")
const info=document.getElementById("info")

let students=[]

function rank(score){

  if(score>=8.5) return "Giỏi"
  if(score>=7) return "Khá"
  if(score>=5) return "Trung bình"

  return "Yếu"
}

function drawTable(){

  table.innerHTML=""

  students.forEach((item,i)=>{

    const row=document.createElement("tr")

    if(item.score<5){
      row.classList.add("warn")
    }

    row.innerHTML=`
    <td>${i+1}</td>
    <td>${item.name}</td>
    <td>${item.score.toFixed(1)}</td>
    <td>${rank(item.score)}</td>
    <td><button class="remove" data-id="${i}">Xóa</button></td>
    `

    table.appendChild(row)

  })

  updateStats()
}

function updateStats(){

  const total=students.length

  let avg=0

  if(total>0){

    const sum=students.reduce((s,v)=>s+v.score,0)
    avg=sum/total
  }

  info.textContent=`Tổng số sinh viên: ${total} | Điểm trung bình: ${avg.toFixed(2)}`
}

function addStudent(){

  const name=nameField.value.trim()
  const score=parseFloat(scoreField.value)

  if(name===""){
    alert("Họ tên không được để trống!")
    nameField.focus()
    return
  }

  if(isNaN(score)||score<0||score>10){
    alert("Điểm phải từ 0 đến 10!")
    scoreField.focus()
    return
  }

  students.push({
    name:name,
    score:score
  })

  drawTable()

  nameField.value=""
  scoreField.value=""
  nameField.focus()
}

addBtn.onclick=addStudent

scoreField.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    addStudent()
  }
})

table.addEventListener("click",e=>{

  if(e.target.classList.contains("remove")){

    const id=e.target.dataset.id

    students.splice(id,1)

    drawTable()
  }

})

</script>

</body>
</html>
